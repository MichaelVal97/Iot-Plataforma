name: CI/CD DataOps

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      apply_terraform:
        description: Apply the Terraform plan to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dataops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q scripts dashboard tests

      - name: Run unit tests
        run: python -m pytest -q

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate

  plan:
    name: Terraform plan
    if: github.event_name != 'pull_request'
    needs: [python, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_atlas_project_id: ${{ vars.ATLAS_PROJECT_ID }}
      TF_VAR_atlas_public_key: ${{ secrets.ATLAS_PUBLIC_KEY }}
      TF_VAR_atlas_private_key: ${{ secrets.ATLAS_PRIVATE_KEY }}
      TF_VAR_aws_profile: ""
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Initialize remote state
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"
          -backend-config="region=$AWS_REGION"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Create plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: terraform/tfplan
          retention-days: 1

  deploy:
    name: Terraform apply gate
    if: always() && needs.python.result == 'success' && needs.terraform.result == 'success'
    needs: [python, terraform, plan]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_terraform && github.ref_name == github.event.repository.default_branch && 'production' || 'ci' }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_atlas_project_id: ${{ vars.ATLAS_PROJECT_ID }}
      TF_VAR_atlas_public_key: ${{ secrets.ATLAS_PUBLIC_KEY }}
      TF_VAR_atlas_private_key: ${{ secrets.ATLAS_PRIVATE_KEY }}
      TF_VAR_aws_profile: ""
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep apply manual
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.ref_name != github.event.repository.default_branch ||
          !inputs.apply_terraform ||
          needs.plan.result != 'success'
        run: echo "No apply requested. To apply, run this workflow manually on the default branch and enable apply_terraform."

      - name: Configure AWS credentials with OIDC
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref_name == github.event.repository.default_branch &&
          inputs.apply_terraform &&
          needs.plan.result == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Initialize remote state
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref_name == github.event.repository.default_branch &&
          inputs.apply_terraform &&
          needs.plan.result == 'success'
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"
          -backend-config="region=$AWS_REGION"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Download plan artifact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref_name == github.event.repository.default_branch &&
          inputs.apply_terraform &&
          needs.plan.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: terraform

      - name: Apply plan
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref_name == github.event.repository.default_branch &&
          inputs.apply_terraform &&
          needs.plan.result == 'success'
        run: terraform apply -input=false -auto-approve tfplan